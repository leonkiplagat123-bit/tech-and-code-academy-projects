<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator</title><style>body{font:18px system-ui;max-width:330px;margin:40px auto}input,button{box-sizing:border-box;width:100%;padding:14px;margin:3px}</style><h1>Calculator</h1><input id="d" value="0" readonly><div id="k"></div><script>let d=document.querySelector("#d");["7","8","9","/","4","5","6","*","1","2","3","-","AC","0",".","+","="].forEach(v=>{let b=document.createElement("button");b.textContent=v;b.onclick=()=>{if(v==="AC")d.value="0";else if(v==="="){try{if(!/^[0-9+*/. -]+$/.test(d.value))throw 0;d.value=String(Function("return ("+d.value+")")())}catch{d.value="Error"}}else d.value=d.value==="0"?v:d.value+v};document.querySelector("#k").append(b)});</script></html>
