<!doctype html><html lang="en"><meta charset="utf-8"><title>Task Manager</title><h1>My Tasks</h1><form id="f"><input id="t" required placeholder="Add task"><button>Add</button></form><ul id="l"></ul><script>let a=JSON.parse(localStorage.tasks||"[]");function draw(){l.replaceChildren();a.forEach((x,i)=>{let li=document.createElement("li"),c=document.createElement("input"),s=document.createElement("span"),b=document.createElement("button");c.type="checkbox";c.checked=x.done;c.onchange=()=>{a[i].done=c.checked;save()};s.textContent=x.text;b.textContent="Delete";b.onclick=()=>{a.splice(i,1);save()};li.append(c,s,b);l.append(li)})}function save(){localStorage.tasks=JSON.stringify(a);draw()}f.onsubmit=e=>{e.preventDefault();a.push({text:t.value,done:false});t.value="";save()};draw();</script></html>
