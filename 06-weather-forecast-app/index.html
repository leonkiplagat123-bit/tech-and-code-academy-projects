<!doctype html><html lang="en"><meta charset="utf-8"><title>Weather Finder</title><h1>Weather Finder</h1><form id="f"><input id="city" required placeholder="City, e.g. Nairobi"><button>Get weather</button></form><p id="out">Enter a city.</p><script>const API_KEY="YOUR_OPENWEATHER_API_KEY";f.onsubmit=async e=>{e.preventDefault();out.textContent="Loading…";try{if(API_KEY.startsWith("YOUR_"))throw Error("Add your OpenWeather API key in this file.");let r=await fetch("https://api.openweathermap.org/data/2.5/weather?q="+encodeURIComponent(city.value)+"&appid="+API_KEY+"&units=metric"),d=await r.json();if(!r.ok)throw Error(d.message);out.textContent=d.name+": "+Math.round(d.main.temp)+"°C, "+d.weather[0].description}catch(x){out.textContent=x.message}}</script></html>
