<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kenya Jobs & Attachment Portal</title><style>
:root{font-family:system-ui,sans-serif;color:#19251e;background:#f4f7f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:24px}.hero{background:#153e33;color:white;padding:28px;border-radius:22px}.hero p{color:#d5e7dd}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.filters input,.filters select{flex:1;min-width:150px;padding:12px;border:1px solid #cbd8ce;border-radius:10px;font:inherit}.jobs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.job{background:white;border:1px solid #dce5de;border-radius:16px;padding:18px}.job h2{margin:8px 0}.muted{color:#65756b}.tag{display:inline-block;background:#e4f4e9;color:#205a41;border-radius:20px;padding:5px 9px;font-size:.85rem}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font:inherit;padding:9px 12px;border:0;border-radius:9px;background:#176e4e;color:white;cursor:pointer}.actions .secondary{background:#e7eee8;color:#203c2d}.count{font-weight:700;margin:14px 0}.empty{background:white;padding:20px;border-radius:12px}@media(max-width:650px){.wrap{padding:14px}.jobs{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="hero"><p>TECH & CODE ACADEMY · PROJECT 13</p><h1>Kenya Jobs & Attachment Portal</h1><p>Explore sample entry-level jobs, internships and industrial attachments across Kenya.</p></header><section class="filters"><input id="search" placeholder="Search title, company or skills"><select id="location"><option value="">All locations</option><option>Nairobi</option><option>Mombasa</option><option>Kisumu</option><option>Nakuru</option><option>Remote</option></select><select id="type"><option value="">All opportunity types</option><option>Full-time</option><option>Internship</option><option>Attachment</option><option>Part-time</option></select><select id="saved-filter"><option value="all">All opportunities</option><option value="saved">Saved only</option></select></section><p class="count" id="count"></p><section class="jobs" id="jobs"></section><p class="muted">Listings are fictional sample data for learning only. The application button creates a local demo record; it does not contact employers.</p></main><script>
const listings=[{id:1,title:"Junior Web Developer",company:"Sample Digital Studio",location:"Nairobi",type:"Full-time",pay:"KSh 35,000–50,000",skills:"HTML CSS JavaScript Git",desc:"Help build responsive websites and learn from a small product team."},{id:2,title:"IT Support Intern",company:"Demo Business Services",location:"Nairobi",type:"Internship",pay:"KSh 12,000 stipend",skills:"Computer support networking communication",desc:"Support staff devices, software setup and basic troubleshooting."},{id:3,title:"Software Development Attachment",company:"Example Tech Hub",location:"Kisumu",type:"Attachment",pay:"Learning placement",skills:"Python SQL Git problem solving",desc:"A structured attachment for students who want practical software experience."},{id:4,title:"Digital Marketing Assistant",company:"Sample Creative Agency",location:"Mombasa",type:"Part-time",pay:"KSh 18,000–25,000",skills:"Social media writing analytics",desc:"Assist with content calendars, campaign reports and community engagement."},{id:5,title:"Data Entry Assistant",company:"Demo Operations Ltd",location:"Nakuru",type:"Full-time",pay:"KSh 25,000–32,000",skills:"Excel accuracy organisation",desc:"Maintain clean records and help teams prepare weekly reports."},{id:6,title:"Remote QA Trainee",company:"Example Software Lab",location:"Remote",type:"Internship",pay:"KSh 15,000 stipend",skills:"Testing bug reports attention to detail",desc:"Learn how to test web apps and write clear bug reports."}];const $=s=>document.querySelector(s);const savedKey="tca-jobs-saved-v1",appliedKey="tca-jobs-applied-v1";let saved=JSON.parse(localStorage.getItem(savedKey)||"[]"),applied=JSON.parse(localStorage.getItem(appliedKey)||"[]");function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function render(){const q=$("#search").value.toLowerCase().trim(),loc=$("#location").value,type=$("#type").value,only=$("#saved-filter").value==="saved";const found=listings.filter(j=>(!q||(j.title+" "+j.company+" "+j.skills+" "+j.desc).toLowerCase().includes(q))&&(!loc||j.location===loc)&&(!type||j.type===type)&&(!only||saved.includes(j.id)));$("#count").textContent=found.length+" opportunity"+(found.length===1?"":"ies")+" · "+saved.length+" saved";$("#jobs").innerHTML=found.map(j=>'<article class="job"><span class="tag">'+esc(j.type)+'</span><h2>'+esc(j.title)+'</h2><strong>'+esc(j.company)+'</strong><div class="meta"><span class="muted">📍 '+esc(j.location)+'</span><span class="muted">💰 '+esc(j.pay)+'</span></div><p>'+esc(j.desc)+'</p><p class="muted"><strong>Skills:</strong> '+esc(j.skills)+'</p><div class="actions"><button data-save="'+j.id+'" class="secondary">'+(saved.includes(j.id)?"★ Saved":"☆ Save job")+'</button><button data-apply="'+j.id+'">'+(applied.includes(j.id)?"Applied (demo)":"Apply (demo)")+'</button></div></article>').join("")||'<p class="empty">No matching opportunities. Try changing your filters.</p>'}["search","location","type","saved-filter"].forEach(id=>$("#"+id).addEventListener("input",render));$("#jobs").addEventListener("click",e=>{const sid=e.target.dataset.save,aid=e.target.dataset.apply;if(sid){const id=Number(sid);saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem(savedKey,JSON.stringify(saved));render()}if(aid){const id=Number(aid);if(!applied.includes(id))applied.push(id);localStorage.setItem(appliedKey,JSON.stringify(applied));alert("Demo application recorded in this browser. No employer was contacted.");render()}});render();
</script></body></html>
