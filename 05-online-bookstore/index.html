<!doctype html><html lang="en"><meta charset="utf-8"><title>Book Nook</title><h1>Book Nook</h1><input id="q" placeholder="Search books"><main id="books"></main><p id="status"></p><script>let data=[["Atomic Habits","James Clear",1200],["The Alchemist","Paulo Coelho",900],["Clean Code","Robert Martin",1800]];function draw(){books.replaceChildren();data.filter(x=>x.join(" ").toLowerCase().includes(q.value.toLowerCase())).forEach(x=>{let a=document.createElement("article"),h=document.createElement("h2"),p=document.createElement("p"),b=document.createElement("button");h.textContent=x[0];p.textContent=x[1]+" · KSh "+x[2];b.textContent="Add to basket";b.onclick=()=>status.textContent="Demo basket: "+x[0];a.append(h,p,b);books.append(a)})}q.oninput=draw;draw();</script></html>
