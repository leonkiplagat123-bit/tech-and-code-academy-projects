<!doctype html><html lang="en"><meta charset="utf-8"><title>LearnSpace</title><h1>LearnSpace</h1><input id="q" placeholder="Search courses"><main id="courses"></main><p id="status">Choose a course.</p><script>let data=[["HTML & CSS Foundations","Beginner"],["JavaScript Essentials","Beginner"],["Python Programming","Beginner"],["Git and GitHub","Beginner"],["Working with Data","Intermediate"]],enrolled=new Set();function draw(){courses.replaceChildren();data.filter(x=>x.join(" ").toLowerCase().includes(q.value.toLowerCase())).forEach(x=>{let a=document.createElement("article"),h=document.createElement("h2"),b=document.createElement("button");h.textContent=x[0];b.textContent=enrolled.has(x[0])?"Enrolled":"Enroll (demo)";b.onclick=()=>{enrolled.add(x[0]);status.textContent="Demo enrolment: "+x[0];draw()};a.append(h,b);courses.append(a)})}q.oninput=draw;draw();</script></html>
